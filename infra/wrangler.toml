name = "workbench-cloud"
main = "workers/api/src/index.ts"
compatibility_date = "2024-10-17"
compatibility_flags = ["d1_executable"]

# --- Bindings ---------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "workbench-dev"
database_id = "workbench-sync-db"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "workbench-assets-dev"

# --- Durable Objects --------------------------------------------------------
[[durable_objects.always_enabled]]
name = "WorkspaceSyncDO"
class_name = "WorkspaceSyncDO"

# --- Tracing ----------------------------------------------------------------
[tracing]
openTelemetry = true
